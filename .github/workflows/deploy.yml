name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Configure public lead API URL
        env:
          KAFI_LEADS_API_URL: ${{ vars.KAFI_LEADS_API_URL }}
        run: |
          node -e 'const fs = require("node:fs"); const url = process.env.KAFI_LEADS_API_URL || "https://kafi-worker.firasajam10.workers.dev/api/inquiries"; if (!url.startsWith("https://")) throw new Error("KAFI_LEADS_API_URL must use HTTPS"); fs.writeFileSync("dist/movecorp-clone/browser/runtime-config.js", `window.KAFI_CONFIG = ${JSON.stringify({ leadsApiUrl: url })};\n`);'

      - name: Add custom domain
        run: printf 'kafitransporte.de\n' > dist/movecorp-clone/browser/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movecorp-clone/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4